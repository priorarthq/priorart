# docker compose up -d --build      → Prior Art API on http://localhost:8080 (or $PRIORART_PORT), Postgres on :5434
# docker compose up -d postgres     → database only, for running the server from source (mvn spring-boot:run)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: priorart
      POSTGRES_USER: priorart
      POSTGRES_PASSWORD: priorart
    ports: ["5434:5432"]
    volumes: ["priorart-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U priorart -d priorart"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  server:
    build: .
    ports: ["${PRIORART_PORT:-8080}:8080"]   # PRIORART_PORT=8090 if 8080 is taken on your machine
    environment:
      PRIORART_DB_URL: jdbc:postgresql://postgres:5432/priorart
      PRIORART_DB_USER: priorart
      PRIORART_DB_PASSWORD: priorart
      # Optional extraction model: any OpenAI-compatible endpoint (set these in your shell or a .env file).
      PRIORART_LLM_PROVIDER: ${PRIORART_LLM_PROVIDER:-none}
      PRIORART_LLM_BASE_URL: ${PRIORART_LLM_BASE_URL:-https://api.openai.com/v1}
      PRIORART_LLM_API_KEY: ${PRIORART_LLM_API_KEY:-}
      PRIORART_LLM_MODEL: ${PRIORART_LLM_MODEL:-gpt-4o-mini}
      PRIORART_EXTRACT_QUIET_SECONDS: ${PRIORART_EXTRACT_QUIET_SECONDS:-300}
      PRIORART_EXTRACT_SWEEP_MS: ${PRIORART_EXTRACT_SWEEP_MS:-60000}
      # required: every team API call carries the caller's personal token (claimed via the skill). off: open, single-user.
      PRIORART_TEAM_AUTH: ${PRIORART_TEAM_AUTH:-required}
      # Handles that may create applications (besides whoever created the first one): comma-separated.
      PRIORART_SERVER_ADMINS: ${PRIORART_SERVER_ADMINS:-}
      # Who may read a repo's work: team (members of its teams) or git (ask GitHub / GitLab; see README).
      PRIORART_REPO_ACCESS: ${PRIORART_REPO_ACCESS:-team}
      PRIORART_GIT_GITHUB_HOST: ${PRIORART_GIT_GITHUB_HOST:-github.com}
      PRIORART_GIT_GITHUB_API: ${PRIORART_GIT_GITHUB_API:-https://api.github.com}
      PRIORART_GIT_GITHUB_WEB: ${PRIORART_GIT_GITHUB_WEB:-https://github.com}
      PRIORART_GIT_GITHUB_CLIENT_ID: ${PRIORART_GIT_GITHUB_CLIENT_ID:-}
      PRIORART_GIT_GITHUB_TOKEN: ${PRIORART_GIT_GITHUB_TOKEN:-}
      PRIORART_GIT_GITLAB_URL: ${PRIORART_GIT_GITLAB_URL:-https://gitlab.com}
      PRIORART_GIT_GITLAB_CLIENT_ID: ${PRIORART_GIT_GITLAB_CLIENT_ID:-}
      PRIORART_GIT_GITLAB_TOKEN: ${PRIORART_GIT_GITLAB_TOKEN:-}
    extra_hosts: ["host.docker.internal:host-gateway"]   # lets a local test stub (e.g. a fake GitHub) be reached
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

volumes:
  priorart-pg:
