name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Server (unit + integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn verify (integration tests use Testcontainers/Postgres)
        working-directory: server
        run: mvn -B verify

  skill-and-mcp:
    name: Skill scripts + MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check skill scripts
        run: for f in plugins/priorart/skills/priorart/scripts/*.mjs mcp/server.mjs; do node --check "$f"; done
      - name: Skill tests (compaction, secret scan, solo mode)
        run: node --test 'tests/skill/*.test.mjs'
      - name: Skill CLI runs with no config (help + status)
        run: |
          node plugins/priorart/skills/priorart/scripts/priorart.mjs help
          HOME="$(mktemp -d)" node plugins/priorart/skills/priorart/scripts/priorart.mjs status
      - name: Installer
        run: HOME="$(mktemp -d)" ./install.sh
      - name: Plugin manifests and hooks are valid JSON, versions agree
        run: |
          for f in plugins/priorart/plugin.json plugins/priorart/.claude-plugin/plugin.json plugins/priorart/hooks/*.json \
                   plugins/priorart/com.github.copilot/hooks/hooks.json .claude-plugin/marketplace.json .agents/plugins/marketplace.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || { echo "invalid JSON: $f"; exit 1; }
          done
          node -e "const r=(f)=>JSON.parse(require('fs').readFileSync(f,'utf8')).version; const a=r('plugins/priorart/plugin.json'), b=r('plugins/priorart/.claude-plugin/plugin.json'); if (a!==b) { console.error('plugin versions differ: '+a+' vs '+b); process.exit(1) }"
      - working-directory: mcp
        run: npm ci

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t priorart:ci .
